[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ramon-chatbot"
version = "0.1.0"
description = "RAMon Chatbot - Technical assistance chatbot for computer e-commerce"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-tavily>=0.2.0",
    "langgraph>=1.0.0",
    "langgraph-checkpoint>=4.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain_postgres>=0.0.17",
    "openai>=2.0.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary,pool]>=3.1.0",
    "pgvector",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "ipython",
    "pygraphviz",
    "pytest>=8.0",
    "ruff>=0.8",
    "tiktoken>=0.7",
]

[tool.setuptools.packages.find]
include = ["chatbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
# Ignore rules that require extensive refactoring of existing source code
ignore = [
    "UP006",   # Use modern type annotations (list instead of List) — existing code uses old style
    "UP035",   # Deprecated typing imports — existing code uses old style
    "UP045",   # Use X | None — existing code uses Optional
    "E501",    # Line too long — prompt strings and URLs
    "I001",    # Import sorting — existing code has its own order
    "SIM117",  # Nested with statements — existing code uses nested pattern
    "B008",    # Depends() in defaults — FastAPI pattern
    "B904",    # raise from err — existing code missing chain
    "W293",    # Whitespace in blank lines — docstrings
]

[tool.ruff.lint.isort]
known-first-party = ["chatbot"]
